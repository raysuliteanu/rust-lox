[package]
name = "rust-lox"
version = "0.1.0"
authors = ["Ray Suliteanu <raysuliteanu@pm.me>"]
edition = "2024"

[dependencies]
bytes = "1.10"
clap = { version = "4.5", features = ["derive"] }
